<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存款复利计算器 - 每年能花多少钱？</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a1a2e'/><path d='M16 44 L26 32 L36 36 L48 18' stroke='%23c9a84c' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='48' cy='18' r='3.5' fill='%23c9a84c'/><path d='M16 44 L26 32 L36 36 L48 18 L48 44 Z' fill='%23c9a84c' opacity='0.15'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 40px;
    font-size: 0.95em;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }
  .input-group {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 24px;
  }
  .field {
    flex: 1;
    min-width: 200px;
  }
  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.9em;
    color: #bbb;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1.1em;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: #ffd200;
  }
  .field select option {
    background: #2a2755;
    color: #fff;
  }
  .pension-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pension-group label {
    margin-bottom: 0 !important;
  }
  .toggle-switch {
    position: relative;
    width: 48px;
    height: 26px;
    flex-shrink: 0;
  }
  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 26px;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle-switch input:checked + .toggle-slider {
    background: #ffd200;
  }
  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(22px);
  }
  .pension-fields {
    display: none;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .pension-fields.show {
    display: flex;
  }
  .field .unit {
    font-size: 0.8em;
    color: #888;
    margin-top: 4px;
  }
  .result-section { margin-top: 8px; }
  .result-box {
    padding: 20px 24px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .result-safe {
    background: rgba(46, 213, 115, 0.12);
    border: 1px solid rgba(46, 213, 115, 0.3);
  }
  .result-warn {
    background: rgba(255, 165, 0, 0.12);
    border: 1px solid rgba(255, 165, 0, 0.3);
  }
  .result-danger {
    background: rgba(255, 71, 87, 0.12);
    border: 1px solid rgba(255, 71, 87, 0.3);
  }
  .result-box .label {
    font-size: 0.85em;
    color: #aaa;
    margin-bottom: 4px;
  }
  .result-box .value {
    font-size: 1.6em;
    font-weight: 700;
  }
  .result-safe .value { color: #2ed573; }
  .result-warn .value { color: #ffa502; }
  .result-danger .value { color: #ff4757; }
  .result-box .detail {
    font-size: 0.85em;
    color: #999;
    margin-top: 6px;
  }

  /* Chart */
  .chart-container {
    margin-top: 8px;
    position: relative;
    width: 100%;
    height: 320px;
  }
  canvas { width: 100% !important; height: 100% !important; cursor: crosshair; }
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(20, 18, 50, 0.92);
    border: 1px solid rgba(255, 210, 0, 0.4);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.82em;
    color: #e0e0e0;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .chart-tooltip.show { opacity: 1; }
  .chart-tooltip .tt-age { color: #ffd200; font-weight: 600; }
  .chart-tooltip .tt-val { color: #2ed573; font-weight: 600; }
  .chart-crosshair-v, .chart-crosshair-h {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .chart-crosshair-v {
    width: 1px;
    border-left: 1px dashed rgba(255, 210, 0, 0.4);
    top: 0; bottom: 0;
  }
  .chart-crosshair-h {
    height: 1px;
    border-top: 1px dashed rgba(255, 210, 0, 0.4);
    left: 0; right: 0;
  }
  .chart-crosshair-v.show, .chart-crosshair-h.show { opacity: 1; }
  .chart-dot {
    position: absolute;
    width: 8px; height: 8px;
    background: #ffd200;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(255, 210, 0, 0.5);
  }
  .chart-dot.show { opacity: 1; }

  /* Table */
  .table-toggle {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: #bbb;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    margin-top: 16px;
    transition: all 0.2s;
  }
  .table-toggle:hover { border-color: #ffd200; color: #ffd200; }
  .year-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 0.85em;
    display: none;
  }
  .year-table.show { display: table; }
  .year-table th, .year-table td {
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .year-table th {
    color: #999;
    font-weight: 500;
    position: sticky;
    top: 0;
    background: #2a2755;
  }
  .year-table td:first-child, .year-table th:first-child { text-align: left; }
  .year-table tr:hover td { background: rgba(255,255,255,0.03); }
  .zero-row td { color: #ff4757; font-weight: 600; }
  .expense-row td { color: #e17055; }

  /* Custom combo select */
  .combo-select {
    position: relative;
    display: inline-block;
  }
  .combo-select input {
    cursor: pointer;
  }
  .combo-select .combo-arrow {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: #666;
    font-size: 0.7em;
    transition: transform 0.2s;
  }
  .combo-select.open .combo-arrow { transform: translateY(-50%) rotate(180deg); }
  .combo-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    background: #2a2755;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    overflow: hidden;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .combo-select.open .combo-dropdown { display: block; }
  .combo-dropdown .combo-option {
    padding: 8px 14px;
    color: #ccc;
    font-size: 0.9em;
    cursor: pointer;
    transition: background 0.1s;
    white-space: nowrap;
  }
  .combo-dropdown .combo-option:hover {
    background: rgba(255,210,0,0.12);
    color: #fff;
  }

  /* Income section */
  .income-section { margin-bottom: 24px; }
  .income-item {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: rgba(46,213,115,0.04);
    border: 1px solid rgba(46,213,115,0.12);
    border-radius: 10px;
    transition: border-color 0.2s;
  }
  .income-item:hover { border-color: rgba(46,213,115,0.3); }
  .income-item { overflow: visible; }
  .income-item input {
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
  }
  .income-item input:focus { border-color: #2ed573; }
  .income-item .inc-amount { width: 140px; }
  .income-item .inc-hint { font-size: 0.75em; color: #888; min-width: 50px; }
  .income-item .inc-remove {
    background: none;
    border: none;
    color: #666;
    font-size: 1.2em;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
    margin-left: auto;
  }
  .income-item .inc-remove:hover { color: #ff4757; background: rgba(255,71,87,0.1); }
  .income-item .inc-summary {
    font-size: 0.78em;
    color: #2ed573;
    width: 100%;
    margin-top: 2px;
  }
  .btn-add-income {
    background: none;
    border: 1px dashed rgba(46,213,115,0.3);
    color: #999;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn-add-income:hover { border-color: #2ed573; color: #2ed573; }

  /* Big expense section */
  .expense-section { margin-bottom: 24px; }
  .expense-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .expense-header h4 { color: #bbb; font-size: 0.9em; font-weight: 500; }
  .expense-list { display: flex; flex-direction: column; gap: 10px; }
  .expense-item {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    transition: border-color 0.2s;
  }
  .expense-item:hover { border-color: rgba(255,255,255,0.18); }
  .expense-item { overflow: visible; }
  .expense-item input, .expense-item select {
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
  }
  .expense-item input:focus, .expense-item select:focus { border-color: #ffd200; }
  .expense-item select option { background: #2a2755; color: #fff; }
  .expense-item .exp-amount { width: 140px; }
  .expense-item .exp-note { width: 100px; }
  .expense-item .exp-hint { font-size: 0.75em; color: #888; min-width: 50px; }
  .expense-item .exp-remove {
    background: none;
    border: none;
    color: #666;
    font-size: 1.2em;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
    margin-left: auto;
  }
  .expense-item .exp-remove:hover { color: #ff4757; background: rgba(255,71,87,0.1); }

  /* Loan sub-row */
  .expense-item .exp-main-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
  }
  .expense-item .exp-loan-row {
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .expense-item .exp-loan-row.show { display: flex; }
  .expense-item .exp-loan-row label {
    font-size: 0.8em;
    color: #888;
    white-space: nowrap;
  }
  .expense-item .exp-loan-row > input,
  .expense-item .exp-loan-row > select {
    padding: 6px 10px;
    font-size: 0.85em;
  }
  .exp-loan-toggle {
    background: none;
    border: 1px solid rgba(255,255,255,0.12);
    color: #888;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78em;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .exp-loan-toggle:hover { border-color: #ffd200; color: #ffd200; }
  .exp-loan-toggle.active { border-color: #e17055; color: #e17055; }
  .exp-loan-info {
    font-size: 0.78em;
    color: #e17055;
    width: 100%;
    margin-top: 4px;
  }

  /* Custom age stepper */
  .age-stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.06);
    transition: border-color 0.2s;
  }
  .age-stepper:focus-within { border-color: #ffd200; }
  .age-stepper input {
    width: 52px;
    text-align: center;
    border: none !important;
    background: transparent !important;
    padding: 6px 2px !important;
    font-size: 0.95em;
    color: #fff;
    outline: none;
    -moz-appearance: textfield;
    border-radius: 0 !important;
  }
  .age-stepper input::-webkit-outer-spin-button,
  .age-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .age-stepper button {
    background: rgba(255,255,255,0.06);
    border: none;
    color: #aaa;
    width: 30px;
    align-self: stretch;
    cursor: pointer;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    user-select: none;
  }
  .age-stepper button:hover { background: rgba(255,210,0,0.15); color: #ffd200; }
  .age-stepper button:active { background: rgba(255,210,0,0.25); }
  .btn-add-expense {
    background: none;
    border: 1px dashed rgba(255,255,255,0.2);
    color: #999;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn-add-expense:hover { border-color: #ffd200; color: #ffd200; }

  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    h1 { font-size: 1.5em; }
    .card { padding: 20px; }
    .result-box .value { font-size: 1.3em; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>存款复利计算器</h1>
  <p class="subtitle">看看你的钱能花多久</p>

  <div class="card">
    <div class="input-group">
      <div class="field">
        <label>当前年龄 (岁)</label>
        <div class="age-stepper" style="width:100%;border-radius:10px;">
          <button type="button" onclick="stepAge('age',-1)">−</button>
          <input type="number" id="age" value="30" min="1" max="120" step="1" style="flex:1;width:auto;font-size:1.1em;padding:12px 4px!important;">
          <button type="button" onclick="stepAge('age',1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>预期寿命 (岁)</label>
        <select id="lifespan">
          <option value="70">70 岁</option>
          <option value="75">75 岁</option>
          <option value="80" selected>80 岁</option>
          <option value="85">85 岁</option>
          <option value="90">90 岁</option>
          <option value="95">95 岁</option>
          <option value="100">100 岁</option>
        </select>
      </div>
      <div class="field">
        <label>总存款 (元)</label>
        <input type="text" id="savings" value="1,000,000" inputmode="numeric">
        <div class="unit" id="savings-hint">100 万</div>
      </div>
      <div class="field">
        <label>年化回报率 (%)</label>
        <div class="age-stepper" style="width:100%;border-radius:10px;">
          <button type="button" onclick="stepRate('rate',-0.1)">−</button>
          <input type="number" id="rate" value="4" min="0" max="100" step="0.1" style="flex:1;width:auto;font-size:1.1em;padding:12px 4px!important;">
          <button type="button" onclick="stepRate('rate',0.1)">+</button>
        </div>
        <div class="unit">投资年化收益率</div>
      </div>
      <div class="field">
        <label>每年花费 (元)</label>
        <input type="text" id="spending" value="80,000" inputmode="numeric">
        <div class="unit" id="spending-hint">8 万</div>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <div class="pension-group">
        <label class="toggle-switch">
          <input type="checkbox" id="pensionToggle">
          <span class="toggle-slider"></span>
        </label>
        <label style="color:#bbb;font-size:0.9em;cursor:pointer;" onclick="$('pensionToggle').click()">领取养老金</label>
      </div>
      <div class="pension-fields" id="pensionFields">
        <div class="field" style="min-width:150px;">
          <label>性别</label>
          <select id="gender">
            <option value="male">男（65 岁领取）</option>
            <option value="female">女（60 岁领取）</option>
          </select>
        </div>
        <div class="field" style="min-width:200px;">
          <label>每月养老金 (元)</label>
          <input type="text" id="pension" value="3,000" inputmode="numeric">
          <div class="unit" id="pension-hint">0.3 万</div>
        </div>
      </div>
    </div>

    <div class="income-section">
      <div class="expense-header">
        <h4>收入计划</h4>
      </div>
      <div class="expense-list" id="incomeList"></div>
      <button class="btn-add-income" id="addIncome">+ 添加收入阶段（工资、副业、租金等）</button>
    </div>

    <div class="expense-section">
      <div class="expense-header">
        <h4>大额支出计划</h4>
      </div>
      <div class="expense-list" id="expenseList"></div>
      <button class="btn-add-expense" id="addExpense">+ 添加大额支出（买房、买车、装修等）</button>
    </div>

    <div class="result-section" id="results"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:16px;color:#ddd;">资产变化趋势</h3>
    <div class="chart-container">
      <canvas id="chart"></canvas>
      <div class="chart-tooltip" id="chartTooltip"></div>
      <div class="chart-crosshair-v" id="crossV"></div>
      <div class="chart-crosshair-h" id="crossH"></div>
      <div class="chart-dot" id="chartDot"></div>
    </div>
    <button class="table-toggle" id="toggleTable">显示详细表格</button>
    <table class="year-table" id="yearTable">
      <thead>
        <tr id="tableHead">
          <th>年龄</th>
          <th>年初余额</th>
          <th>投资收益</th>
          <th>养老金</th>
          <th>年度支出</th>
          <th>年末余额</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function stepAge(inputId, delta) {
  const input = typeof inputId === 'string' ? $(inputId) : inputId;
  const min = parseInt(input.min) || 1;
  const max = parseInt(input.max) || 120;
  let val = (parseInt(input.value) || 0) + delta;
  val = Math.max(min, Math.min(max, val));
  input.value = val;
  input.dispatchEvent(new Event('input'));
}

function stepRate(inputId, delta) {
  const input = typeof inputId === 'string' ? $(inputId) : inputId;
  const min = parseFloat(input.min) || 0;
  const max = parseFloat(input.max) || 100;
  let val = Math.round(((parseFloat(input.value) || 0) + delta) * 10) / 10;
  val = Math.max(min, Math.min(max, val));
  input.value = val;
  input.dispatchEvent(new Event('input'));
}

// Custom combo select: editable input + always-show-all dropdown
function createComboSelect(options, opts) {
  const width = opts.width || '100px';
  const placeholder = opts.placeholder || '选择或输入';
  const onSelect = opts.onSelect || function(){};

  const wrap = document.createElement('div');
  wrap.className = 'combo-select';
  wrap.style.width = width;

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder;
  input.style.width = '100%';
  input.style.paddingRight = '24px';
  if (opts.dataField) input.dataset.field = opts.dataField;

  const arrow = document.createElement('span');
  arrow.className = 'combo-arrow';
  arrow.textContent = '\u25BC';

  const dropdown = document.createElement('div');
  dropdown.className = 'combo-dropdown';
  options.forEach(opt => {
    const item = document.createElement('div');
    item.className = 'combo-option';
    item.textContent = opt;
    item.addEventListener('mousedown', function(e) {
      e.preventDefault();
      input.value = opt;
      wrap.classList.remove('open');
      onSelect(opt);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
    dropdown.appendChild(item);
  });

  wrap.appendChild(input);
  wrap.appendChild(arrow);
  wrap.appendChild(dropdown);

  input.addEventListener('focus', function() { wrap.classList.add('open'); });
  input.addEventListener('blur', function() { wrap.classList.remove('open'); });

  return { wrap, input };
}

function formatMoney(n) {
  if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(2) + ' 万';
  return n.toFixed(2) + ' 元';
}

// Format number with commas: 1000000 -> "1,000,000"
function addCommas(n) {
  const parts = n.toString().split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}

// Parse formatted string to number: "1,000,000" -> 1000000
function parseFormatted(s) {
  return parseFloat(String(s).replace(/,/g, '')) || 0;
}

// Chinese wan/yi hint: 1000000 -> "100w"
function wanHint(n) {
  if (n >= 1e8) return (n / 1e8) + ' 亿';
  if (n >= 1e4) return (n / 1e4) + ' 万';
  if (n > 0) return n + ' 元';
  return '';
}

// Setup formatted money input
function setupMoneyInput(inputId, hintId) {
  const input = $(inputId);
  const hint = $(hintId);

  function updateHint() {
    const val = parseFormatted(input.value);
    hint.textContent = wanHint(val);
  }

  input.addEventListener('input', function() {
    // Remember cursor position relative to digits
    const pos = this.selectionStart;
    const beforeCursor = this.value.substring(0, pos);
    const digitsBefore = beforeCursor.replace(/[^0-9]/g, '').length;

    // Clean and reformat
    const raw = this.value.replace(/[^0-9]/g, '');
    const num = parseInt(raw) || 0;
    this.value = num > 0 ? addCommas(num) : '';

    // Restore cursor position
    let newPos = 0, digits = 0;
    for (let i = 0; i < this.value.length; i++) {
      if (this.value[i] !== ',') digits++;
      if (digits >= digitsBefore) { newPos = i + 1; break; }
    }
    if (digits < digitsBefore) newPos = this.value.length;
    this.setSelectionRange(newPos, newPos);

    updateHint();
    calculate();
  });

  updateHint();
}

function calculate() {
  const age = parseInt($('age').value) || 30;
  const savings = parseFormatted($('savings').value);
  const rate = (parseFloat($('rate').value) || 0) / 100;
  const spending = parseFormatted($('spending').value);
  const lifespan = parseInt($('lifespan').value) || 80;
  const remainingYears = Math.max(lifespan - age, 1);

  // Pension
  const hasPension = $('pensionToggle').checked;
  const gender = $('gender').value;
  const pensionMonthly = parseFormatted($('pension').value);
  const pensionYearly = pensionMonthly * 12;
  const pensionStartAge = gender === 'male' ? 65 : 60;

  // Incomes
  const incomes = getIncomes();

  // Big expenses
  const expenses = getExpenses();
  const expenseByAge = {};
  expenses.forEach(e => {
    if (!expenseByAge[e.age]) expenseByAge[e.age] = [];
    expenseByAge[e.age].push(e);
  });

  const safeSpending = savings * rate;
  const resultsEl = $('results');

  // Calculate year-by-year until lifespan
  const years = [];
  let balance = savings;
  let depleted = -1;

  for (let i = 1; i <= remainingYears; i++) {
    const currentAge = age + i;
    const interest = balance * rate;
    const pensionIncome = (hasPension && currentAge >= pensionStartAge) ? pensionYearly : 0;

    // Work income this year
    let workIncome = 0;
    incomes.forEach(inc => {
      if (currentAge >= inc.startAge && currentAge < inc.endAge) {
        workIncome += inc.yearly;
      }
    });

    // Big expenses this year (down payments)
    const yearExpenses = expenseByAge[currentAge] || [];
    const bigExpenseTotal = yearExpenses.reduce((sum, e) => sum + e.amount, 0);
    const bigExpenseNotes = yearExpenses.map(e => {
      if (e.loanAmount > 0) return e.note + ' 首付' + formatMoney(e.amount);
      return e.note + ' ' + formatMoney(e.amount);
    }).join('、');

    // Loan repayments ongoing this year
    let loanRepayment = 0;
    const loanDetails = [];
    expenses.forEach(e => {
      if (e.loanYearlyPayment > 0 && currentAge > e.age && currentAge <= e.age + e.loanYears) {
        loanRepayment += e.loanYearlyPayment;
        loanDetails.push(e.note + '月供');
      }
    });

    const totalIncome = workIncome + pensionIncome;
    const netSpending = spending + bigExpenseTotal + loanRepayment - totalIncome;
    const yearEnd = balance + interest - netSpending;
    years.push({
      year: i,
      age: currentAge,
      startBalance: balance,
      interest: interest,
      pension: pensionIncome,
      workIncome: workIncome,
      spending: spending,
      bigExpense: bigExpenseTotal,
      bigExpenseNotes: bigExpenseNotes,
      loanRepayment: loanRepayment,
      loanDetails: loanDetails.join('、'),
      netSpending: netSpending,
      endBalance: Math.max(yearEnd, 0)
    });
    if (yearEnd <= 0 && depleted < 0) {
      depleted = i;
      break;
    }
    balance = yearEnd;
  }

  const lastBalance = years.length > 0 ? years[years.length - 1].endBalance : savings;

  // Results display
  let html = '';

  // Safe spending hint (including pension after retirement)
  let safeDetail = `每月 ${formatMoney(safeSpending / 12)}，按此花费永远不会花光本金`;
  if (hasPension) {
    safeDetail += `<br>领取养老金后（${pensionStartAge} 岁起），安全支出可提高到 ${formatMoney(safeSpending + pensionYearly)}/年`;
  }
  html += `<div class="result-box result-safe">
    <div class="label">永续安全支出（每年利息${hasPension ? ' + 养老金' : ''}）</div>
    <div class="value">${formatMoney(safeSpending)}/年</div>
    <div class="detail">${safeDetail}</div>
  </div>`;

  if (spending <= safeSpending) {
    html += `<div class="result-box result-safe">
      <div class="label">当前花费状态（到 ${lifespan} 岁，还有 ${remainingYears} 年）</div>
      <div class="value">永远花不完</div>
      <div class="detail">你的年支出 ${formatMoney(spending)} ≤ 年利息 ${formatMoney(safeSpending)}，到 ${lifespan} 岁时还剩 ${formatMoney(lastBalance)}</div>
    </div>`;
  } else if (depleted < 0) {
    html += `<div class="result-box result-warn">
      <div class="label">当前花费状态（到 ${lifespan} 岁，还有 ${remainingYears} 年）</div>
      <div class="value">够花到 ${lifespan} 岁</div>
      <div class="detail">虽然每年消耗本金，但到 ${lifespan} 岁时还剩 ${formatMoney(lastBalance)}${hasPension ? '（含养老金补贴）' : ''}</div>
    </div>`;
  } else {
    const depletedAge = age + depleted;
    const cls = depleted <= 20 ? 'result-danger' : 'result-warn';
    html += `<div class="result-box ${cls}">
      <div class="label">预计耗尽时间</div>
      <div class="value">${depleted} 年后花光（${depletedAge} 岁）</div>
      <div class="detail">你的年支出 ${formatMoney(spending)} 超过承受能力，${depletedAge < lifespan ? '撑不到 ' + lifespan + ' 岁' : '刚好到 ' + lifespan + ' 岁'}${hasPension && depletedAge < pensionStartAge ? '（还没开始领养老金）' : ''}</div>
    </div>`;
  }

  // Expense summary
  if (expenses.length > 0) {
    const totalDown = expenses.reduce((s, e) => s + e.amount, 0);
    const totalLoan = expenses.reduce((s, e) => s + (e.loanAmount || 0), 0);
    const expList = expenses.map(e => {
      let s = `${e.age}岁 ${e.note}`;
      if (e.loanAmount > 0) {
        s += ` 首付${formatMoney(e.amount)} + 贷款${formatMoney(e.loanAmount)}（年还${formatMoney(e.loanYearlyPayment)}×${e.loanYears}年）`;
      } else {
        s += ` ${formatMoney(e.amount)}`;
      }
      return s;
    }).join('<br>');
    const totalLabel = totalLoan > 0 ? `一次性支出 ${formatMoney(totalDown)}，贷款 ${formatMoney(totalLoan)}` : `共 ${formatMoney(totalDown)}`;
    html += `<div class="result-box" style="background:rgba(225,112,85,0.1);border:1px solid rgba(225,112,85,0.3);">
      <div class="label">大额支出计划</div>
      <div class="value" style="color:#e17055;font-size:1.3em;">${totalLabel}</div>
      <div class="detail">${expList}</div>
    </div>`;
  }

  resultsEl.innerHTML = html;

  // Draw chart & table
  drawChart(years, depleted, age);
  fillTable(years, hasPension, incomes.length > 0, expenses.length > 0);
}

function drawChart(years, depleted, startAge) {
  const canvas = $('chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  ctx.clearRect(0, 0, W, H);

  if (years.length === 0) return;

  const data = [years[0].startBalance, ...years.map(y => y.endBalance)];
  const maxVal = Math.max(...data) * 1.1 || 1;
  const padL = 70, padR = 20, padT = 28, padB = 40;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
    // Label
    const val = maxVal * (1 - i / 4);
    ctx.fillStyle = '#666';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(formatMoney(val), padL - 8, y + 4);
  }

  // X labels
  ctx.fillStyle = '#666';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(data.length / 8));
  for (let i = 0; i < data.length; i += step) {
    const x = padL + (i / (data.length - 1)) * chartW;
    ctx.fillText((startAge + i) + '岁', x, H - 10);
  }

  // Line
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = padL + (i / (data.length - 1)) * chartW;
    const y = padT + chartH * (1 - data[i] / maxVal);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#ffd200';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Gradient fill
  const lastX = padL + chartW;
  ctx.lineTo(lastX, padT + chartH);
  ctx.lineTo(padL, padT + chartH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, 'rgba(255,210,0,0.25)');
  grad.addColorStop(1, 'rgba(255,210,0,0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Draw big expense / loan markers
  years.forEach((y, i) => {
    const dx = padL + ((i + 1) / (data.length - 1)) * chartW;
    if (y.bigExpense > 0) {
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = 'rgba(225, 112, 85, 0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(dx, padT);
      ctx.lineTo(dx, padT + chartH);
      ctx.stroke();
      ctx.setLineDash([]);
      // Triangle marker at top
      ctx.fillStyle = '#e17055';
      ctx.beginPath();
      ctx.moveTo(dx, padT);
      ctx.lineTo(dx - 4, padT - 8);
      ctx.lineTo(dx + 4, padT - 8);
      ctx.closePath();
      ctx.fill();
    } else if (y.loanRepayment > 0) {
      // Subtle tick at bottom for loan repayment years
      ctx.fillStyle = 'rgba(225, 112, 85, 0.3)';
      ctx.fillRect(dx - 0.5, padT + chartH - 4, 1, 4);
    }
  });

  // Store chart metadata for tooltip
  const extraInfoByIdx = {};
  years.forEach((y, i) => {
    const parts = [];
    if (y.workIncome > 0) parts.push('<span style="color:#2ed573">收入 +' + formatMoney(y.workIncome) + '</span>');
    if (y.bigExpense > 0) parts.push('<span style="color:#e17055">' + y.bigExpenseNotes + '</span>');
    if (y.loanRepayment > 0) parts.push('<span style="color:#e17055">还贷 ' + formatMoney(y.loanRepayment) + '</span>');
    if (parts.length > 0) extraInfoByIdx[i + 1] = parts.join('<br>');
  });
  canvas._chartMeta = { data, maxVal, padL, padR, padT, padB, chartW, chartH, startAge, W, H, extraInfo: extraInfoByIdx };

  // Zero line if depleted
  if (depleted > 0) {
    const zx = padL + (depleted / (data.length - 1)) * chartW;
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = '#ff4757';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(zx, padT);
    ctx.lineTo(zx, padT + chartH);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText((startAge + depleted) + '岁耗尽', zx, padT - 4);
  }
}

// Chart tooltip interaction
(function() {
  const canvas = $('chart');
  const tooltip = $('chartTooltip');
  const crossV = $('crossV');
  const crossH = $('crossH');
  const dot = $('chartDot');
  const container = canvas.parentElement;

  function hideTooltip() {
    tooltip.classList.remove('show');
    crossV.classList.remove('show');
    crossH.classList.remove('show');
    dot.classList.remove('show');
  }

  container.addEventListener('mousemove', function(e) {
    const meta = canvas._chartMeta;
    if (!meta || meta.data.length < 2) { hideTooltip(); return; }

    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Check if within chart area
    if (mx < meta.padL || mx > meta.W - meta.padR || my < meta.padT || my > meta.padT + meta.chartH) {
      hideTooltip();
      return;
    }

    // Find nearest data point
    const ratio = (mx - meta.padL) / meta.chartW;
    const idx = Math.round(ratio * (meta.data.length - 1));
    const clampedIdx = Math.max(0, Math.min(meta.data.length - 1, idx));

    const pointX = meta.padL + (clampedIdx / (meta.data.length - 1)) * meta.chartW;
    const pointY = meta.padT + meta.chartH * (1 - meta.data[clampedIdx] / meta.maxVal);

    const age = meta.startAge + clampedIdx;
    const val = meta.data[clampedIdx];

    // Position crosshairs
    crossV.style.left = pointX + 'px';
    crossH.style.top = pointY + 'px';
    crossV.classList.add('show');
    crossH.classList.add('show');

    // Position dot
    dot.style.left = pointX + 'px';
    dot.style.top = pointY + 'px';
    dot.classList.add('show');

    // Position tooltip
    const extra = meta.extraInfo && meta.extraInfo[clampedIdx] ? '<br>' + meta.extraInfo[clampedIdx] : '';
    tooltip.innerHTML = `<span class="tt-age">${age} 岁</span><br>余额: <span class="tt-val">${formatMoney(val)}</span>${extra}`;
    tooltip.classList.add('show');

    // Adjust tooltip position to avoid overflow
    const ttW = tooltip.offsetWidth;
    const ttH = tooltip.offsetHeight;
    let tx = pointX + 12;
    let ty = pointY - ttH - 12;
    if (tx + ttW > meta.W) tx = pointX - ttW - 12;
    if (ty < 0) ty = pointY + 16;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  });

  container.addEventListener('mouseleave', hideTooltip);
})();

function fillTable(years, hasPension, hasIncome, hasExpenses) {
  // Update header
  let cols = '<th>年龄</th><th>年初余额</th><th>投资收益</th>';
  if (hasIncome) cols += '<th>工作收入</th>';
  if (hasPension) cols += '<th>养老金</th>';
  cols += '<th>日常支出</th>';
  if (hasExpenses) cols += '<th>大额/还贷</th>';
  cols += '<th>年末余额</th>';
  $('tableHead').innerHTML = cols;

  const tbody = $('tableBody');
  tbody.innerHTML = years.map(y => {
    const hasExtra = y.bigExpense > 0 || y.loanRepayment > 0;
    const cls = y.endBalance <= 0 ? 'zero-row' : (hasExtra ? 'expense-row' : '');
    const incomeCol = hasIncome ? `<td style="color:#2ed573">${y.workIncome > 0 ? '+' + formatMoney(y.workIncome) : '-'}</td>` : '';
    const pensionCol = hasPension ? `<td style="color:#2ed573">${y.pension > 0 ? '+' + formatMoney(y.pension) : '-'}</td>` : '';
    let extraCol = '';
    if (hasExpenses) {
      const parts = [];
      if (y.bigExpense > 0) parts.push(y.bigExpenseNotes);
      if (y.loanRepayment > 0) parts.push('还贷 ' + formatMoney(y.loanRepayment));
      const extraTotal = y.bigExpense + y.loanRepayment;
      extraCol = `<td style="color:#e17055" title="${parts.join('；')}">${extraTotal > 0 ? '-' + formatMoney(extraTotal) : '-'}</td>`;
    }
    return `<tr ${cls ? 'class="' + cls + '"' : ''}>
      <td>${y.age} 岁${hasExtra ? ' *' : ''}</td>
      <td>${formatMoney(y.startBalance)}</td>
      <td>+${formatMoney(y.interest)}</td>
      ${incomeCol}
      ${pensionCol}
      <td>-${formatMoney(y.spending)}</td>
      ${extraCol}
      <td>${formatMoney(y.endBalance)}</td>
    </tr>`;
  }).join('');
}

$('toggleTable').addEventListener('click', function() {
  const t = $('yearTable');
  t.classList.toggle('show');
  this.textContent = t.classList.contains('show') ? '隐藏详细表格' : '显示详细表格';
});
